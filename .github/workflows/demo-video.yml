name: Demo video

on:
  workflow_dispatch:
    inputs:
      attach_release:
        description: "MP4を GitHub Release（tag: demo-video）にも添付する"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record demo MP4
        run: npm run record
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-demo-mp4
          path: |
            artifacts/benchmark-demo.mp4
            artifacts/screenshot_dashboard.png
          if-no-files-found: error
      - name: Attach MP4 to the demo-video release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-video
          target_commitish: ${{ github.sha }}
          name: デモ動画
          make_latest: false
          body: |
            ブラウザ内ローカルLLMベンチマークのサンプル再生です。
            映像とカードの数値は実測ではありません（?demo=1）。
          files: artifacts/benchmark-demo.mp4
