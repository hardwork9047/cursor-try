[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Same inspection, line, and sensor kernels as the JavaScript side."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
